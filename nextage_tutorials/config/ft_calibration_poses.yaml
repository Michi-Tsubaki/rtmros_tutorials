# Radians relative to the measured starting posture; wrist motion only.
# Clear the workspace first. The waist/head/opposite arm keep their initial angles.
# Two nonparallel wrist axes provide gravity excitation without waist movement.
offset_joints: ['{ARM}_JOINT4', '{ARM}_JOINT5']
offsets:
  - [ 0.00,  0.00]
  - [ 0.35,  0.00]
  - [-0.35,  0.00]
  - [ 0.00,  0.35]
  - [ 0.00, -0.35]
  - [ 0.35,  0.35]
  - [-0.35,  0.35]
  - [-0.35, -0.35]
  - [ 0.35, -0.35]
